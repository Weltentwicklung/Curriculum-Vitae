<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Styles/styles.css">
    <title>My "first" Website</title>
  </head>
  <body>
    <section id="form-section">
      <h1 id="form-title">Contact Formular</h1>
      <form id="form-form"
        action="https://formspree.io/f/mwvwqvrr"
        method="POST"
        >
        <label>*Name: <input type="name" name="name"></label>
        <label>*Your email: <input type="email" name="email"></label>
        <br>
        <br>
        <p>Address</p>
        <label><input type="street" name="street"></label>
        <br>
        <br>
        <label>Your message: 
          <textarea name="message" id="form-message"></textarea>
        </label>
        <button type="submit" id="form-submit">Send</button>
        <p id="form-end">*required</p>
      </form>

      

      <a href="index.html" id="back-btn">Back to Curriculum Vitae</a>

    </section>

  </body>
</html>
